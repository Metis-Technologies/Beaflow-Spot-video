import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ───────── motore 2D (HANDOFF §7) ───────── */
const DURATION = 15, FPS = 30, SP = 0.8, SO = 0.9;
function bez(x1,y1,x2,y2){ const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const fx=t=>((ax*t+bx)*t+cx)*t, fy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0)return 0; if(p>=1)return 1; let t=p; for(let i=0;i<10;i++){ const e=fx(t)-p; if(Math.abs(e)<1e-6)break; const d=dx(t); if(Math.abs(d)<1e-6)break; t-=e/d; } return fy(Math.min(1,Math.max(0,t))); }; }

  return p=>{ if(p>=1)return 1; const t=p*dur; return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t)); }; }

const reg = new Map();
const $ = s=>[...document.querySelectorAll(s)];
const els = t => typeof t==='string' ? $(t) : (t instanceof Element ? [t] : [...t]);
const ent = el => { if(!reg.has(el)) reg.set(el,{p:{},fx:[]}); return reg.get(el); };
function tw(target,s,d,props,e='enter'){ els(target).forEach(el=>{ const r=ent(el);
  for(const k in props){ (r.p[k]??=[]).push({s,d,a:props[k][0],b:props[k][1],e}); r.p[k].sort((x,y)=>x.s-y.s);} }); }

function fx(target,fn){ els(target).forEach(el=>ent(el).fx.push(fn)); }
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function val(list,t){ let cur=null; for(const k of list){ if(t>=k.s) cur=k; else break; }
  if(!cur) return list[0].a; const p=cur.d<=0?1:clamp((t-cur.s)/cur.d); return cur.a+(cur.b-cur.a)*E[cur.e](p); }
function seek2d(t){
  reg.forEach((r,el)=>{
    const v={}; for(const k in r.p) v[k]=val(r.p[k],t);
    const has=k=>v[k]!==undefined;
    if(has('x')||has('y')||has('scale')||has('rot'))
      el.style.transform=`translate(${v.x??0}px,${v.y??0}px) rotate(${v.rot??0}deg) scale(${v.scale??1})`;
    if(has('opacity')){ el.style.opacity=v.opacity; el.style.visibility=v.opacity<=0.001?'hidden':'visible'; }
    if(has('blur')) el.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';
    for(const f of r.fx) f(el,t);
  });
}
const hidden  = sel => tw(sel, 0, 0.01, {opacity:[0,0]});
const titleIn = (sel,s) => { hidden(`${sel} .w`); stagger(`${sel} .w`, s, 0.05, 0.4, {opacity:[0,1], y:[24,0], blur:[8,0]}, 'enter'); };
const outT    = (sel,s) => tw(sel, s, 0.3, {opacity:[1,0], y:[0,-24], blur:[0,8]}, 'exit');
const popIn   = (sel,s,y=40) => { hidden(sel); tw(sel,s,0.12,{opacity:[0,1]},'lin'); tw(sel,s,SO,{y:[y,0],scale:[.9,1]},'soft'); };

/* ───────── timeline UI ───────── */
// scene: 0 · 2,5 · 5 · 7,5 · 10 · 12,5 · 15
hidden('#logoS'); tw('#logoS',0.05,0.4,{opacity:[0,1]},'enter'); tw('#logoS',12.25,0.3,{opacity:[1,0]},'exit');
tw('#shade',0,0.01,{opacity:[1,1]}); tw('#shade',12.4,0.4,{opacity:[1,0]},'exit');
titleIn('#t1',0.1); hidden('#t1b .w'); stagger('#t1b .w',0.75,0.08,0.4,{opacity:[0,1],y:[24,0],blur:[8,0]},'enter');
outT('#h1',2.2);
titleIn('#t2',2.6); outT('#t2',4.65);
titleIn('#t3',5.1); outT('#t3',7.15);
titleIn('#t4',7.6); tw('#kpi',8.1,0.4,{opacity:[0,1],y:[24,0],blur:[8,0]},'enter'); outT('#t4',9.65); outT('#kpi',9.65);
fx('#kpiN',(el,t)=>{ const p=E.inout(clamp((t-8.2)/1.3)); el.textContent='€ '+Math.round(1240*p).toLocaleString('it-IT'); });
popIn('#notif',10.15,80); hidden('#pill'); tw('#pill',10.9,0.12,{opacity:[0,1]},'lin'); tw('#pill',10.9,SP,{scale:[.8,1]},'spring');
outT('#notif',12.15);
hidden('#logoB'); tw('#logoB',13.05,0.12,{opacity:[0,1]},'lin'); tw('#logoB',13.05,SO,{scale:[.86,1],blur:[10,0]},'soft');
popIn('#btn',13.3,40); tw('#btn',14.15,0.1,{scale:[1,.93]},'exit'); tw('#btn',14.25,SO,{scale:[.93,1]},'soft');
hidden('#offer'); tw('#offer',13.5,0.4,{opacity:[0,1],y:[24,0]},'enter');
hidden('#url'); tw('#url',13.6,0.4,{opacity:[0,1],y:[24,0]},'enter');
// lampi sul battito
const FL=[[2.5,.55],[12.85,.7]];
fx('#flash',(el,t)=>{ let o=0; for(const [c,a] of FL){ const d=t-c; if(d>-0.06&&d<0.5) o=Math.max(o, a*(d<0? (d+0.06)/0.06 : Math.exp(-d*9))); } el.style.opacity=o; });

/* ───────── scena 3D ───────── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(1080,1920,false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e0e0e);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4,6,8); scene.add(key);
const rim = new THREE.PointLight(0xffffff, 40, 30, 2); rim.position.set(-4,3,-4); scene.add(rim);
const core = new THREE.PointLight(0xffffff, 0, 12, 2); scene.add(core);

let seed=7; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

const N = 48, C = new THREE.Vector3(0,-1.35,0);
const geo = new RoundedBoxGeometry(1,1,1,3,0.12);
const aGlow = new THREE.InstancedBufferAttribute(new Float32Array(N),1); geo.setAttribute('aGlow',aGlow);
const glowU = {value:new THREE.Color()};
const mat = new THREE.MeshStandardMaterial({color:0xffffff, metalness:0.7, roughness:0.32});
mat.onBeforeCompile = sh => {
  sh.uniforms.uGlowColor = glowU;
  sh.vertexShader = 'attribute float aGlow;\nvarying float vGlow;\n' + sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvGlow = aGlow;');
  sh.fragmentShader = 'uniform vec3 uGlowColor;\nvarying float vGlow;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance += uGlowColor * vGlow;');
};
const tiles = new THREE.InstancedMesh(geo, mat, N);
tiles.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
scene.add(tiles);

// pannello dell'agenda (scena 3)
const panel = new THREE.Mesh(new RoundedBoxGeometry(4.3,4.4,0.12,4,0.1), new THREE.MeshStandardMaterial({color:0x1b1b1b, metalness:0.5, roughness:0.4}));
panel.position.set(0,-1.35,-0.25); scene.add(panel);

// particelle
const PN=700, pp=new Float32Array(PN*3), p0=[];
for(let i=0;i<PN;i++) p0.push([rnd()*18-9, rnd()*24-12, rnd()*26-18, 0.15+rnd()*0.35]);
const pgeo=new THREE.BufferGeometry(); pgeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dot=document.createElement('canvas'); dot.width=dot.height=64; const g=dot.getContext('2d');
const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.6)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64);
const pmat=new THREE.PointsMaterial({size:0.09, map:new THREE.CanvasTexture(dot), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color:0xffffff});
scene.add(new THREE.Points(pgeo,pmat));

/* formazioni: ognuna restituisce per ogni tessera posizione, rotazione, scala, glow, carta(0..1) */
const R = Array.from({length:N},()=>[rnd(),rnd(),rnd(),rnd(),rnd(),rnd(),rnd()]);
const V=(x,y,z)=>new THREE.Vector3(x,y,z), Q=new THREE.Quaternion(), Eu=new THREE.Euler();
const qe=(x,y,z)=>new THREE.Quaternion().setFromEuler(Eu.set(x,y,z));
const F = {
  fogli(t){ return R.map((r,i)=>({ p:V(r[0]*8-4, r[1]*10-5, r[2]*-12+3.5).add(V(0,Math.sin(t*0.8+i)*0.15,0)),
      q:qe(r[3]*6+t*(r[4]-.5)*1.2, r[5]*6+t*(r[6]-.5), r[4]*6), s:V(0.95,1.2,0.03), g:(i%4===0)?0.55:0, c:1 })); },
  anello(t){ return R.map((r,i)=>{ const a=i/N*Math.PI*2 + t*0.55; const rad=2.0;
      const p=V(Math.cos(a)*rad, Math.sin(a)*rad, 0).applyQuaternion(qe(0.35,0.25,0)).add(C);
      return { p, q:qe(0.35,0.25,0).multiply(qe(0,0,a)), s:V(0.5,0.16,0.22), g:0.75, c:0 }; }); },
  agenda(t){ return R.map((r,i)=>{ const col=i%4, row=Math.floor(i/4);
      const booked=[1,6,9,14,19,20,27,30,35,41,44].includes(i); const on=booked? clamp((t-5.55-[1,6,9,14,19,20,27,30,35,41,44].indexOf(i)*0.13)/0.25):0;
      return { p:V((col-1.5)*0.95, C.y+(5.5-row)*0.31, 0), q:new THREE.Quaternion(), s:V(0.84,0.26,0.08+on*0.1), g:0.04+on*1.0, c:0 }; }); },
  barre(t){ const h=[2,3,2,4,3,5,4,6]; return R.map((r,i)=>{ const k=i%8, lv=Math.floor(i/8), vis=lv<h[k];
      return { p:V((k-3.5)*0.52, C.y-0.75+lv*0.4, 0), q:qe(0,0,0), s:vis?V(0.42,0.34,0.42):V(0.001,0.001,0.001), g:vis?(lv===h[k]-1?1.1:0.03):0, c:0 }; }); },
  sfera(t){ const ga=Math.PI*(3-Math.sqrt(5)); return R.map((r,i)=>{ const y=1-(i+0.5)/N*2, rr=Math.sqrt(1-y*y), th=ga*i+t*0.5;
      const n=V(Math.cos(th)*rr, y, Math.sin(th)*rr); const puls=1+0.06*Math.sin((t-10)*Math.PI*4);
      const q=new THREE.Quaternion().setFromUnitVectors(V(0,0,1), n);
      return { p:n.clone().multiplyScalar(1.35*puls).add(C), q, s:V(0.34,0.34,0.07), g:0.25+0.45*Math.max(0,Math.sin((t-10)*Math.PI*4)), c:0 }; }); },
  punto(t){ return R.map(()=>({ p:C.clone(), q:new THREE.Quaternion(), s:V(0.02,0.02,0.02), g:4, c:0 })); },
  alone(t){ return R.map((r,i)=>{ const a=i/N*Math.PI*2 + t*0.3; const tilt=qe(1.15,0,0.1);
      const p=V(Math.cos(a)*3.4, Math.sin(a)*3.4, 0).applyQuaternion(tilt).add(V(0,1.0,-3.4));
      return { p, q:tilt.clone().multiply(qe(0,0,a)), s:V(0.36,0.08,0.08), g:0.6, c:0 }; }); },
};
const TR = [['fogli','anello',2.15,0.85],['anello','agenda',4.55,0.8],['agenda','barre',7.05,0.8],['barre','sfera',9.55,0.8],['sfera','punto',12.1,0.7],['punto','alone',12.86,0.9]];
const paper = new THREE.Color(0x8f8a83), metal = new THREE.Color(0x3a3a3a), tmpC=new THREE.Color();
const M4=new THREE.Matrix4();
function tilesAt(t){
  const cache={}; const get=n=>cache[n]??=F[n](t);
  for(let i=0;i<N;i++){
    let st=get('fogli')[i];
    for(const [a,b,s,d] of TR){ const del=(i/N)*0.28; if(t<s+del) break;
      const u=E.morph(clamp((t-s-del)/d)), A=get(a)[i], B=get(b)[i];

/* camera: spline continua, veloce sui cambi scena e lenta durante la lettura */
const CK = [
 [0.0,  V(1.4,0.9,15.5),  V(0,0.2,-2), 4],
 [2.2,  V(0.2,0.1,6.0),   V(0,-0.4,-3), -3],
 [2.8,  V(-2.6,0.8,11.8), V(0,0,0), 1],
 [4.45, V(-3.6,1.8,11.2), V(0,0,0), 3],

 [9.45, V(-1.4,-2.0,11.8),V(0,0.3,0), 1],
 [10.1, V(0.2,0.6,10.4),  V(0,-0.4,0), 0],

 [15.0, V(0,0.5,14.6),    V(0,0.4,0), 0],
];
const posC=new THREE.CatmullRomCurve3(CK.map(k=>k[1]),false,'centripetal');
const tgtC=new THREE.CatmullRomCurve3(CK.map(k=>k[2]),false,'centripetal');
function camAt(t){
  let i=0; while(i<CK.length-2 && t>=CK[i+1][0]) i++;
  const a=CK[i], b=CK[i+1], f=clamp((t-a[0])/(b[0]-a[0])), u=(i+f)/(CK.length-1);
  cam.position.copy(posC.getPoint(u)); cam.lookAt(tgtC.getPoint(u));
  cam.rotateZ(THREE.MathUtils.degToRad(a[3]+(b[3]-a[3])*E.inout(f)));
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(540,960), 0.8, 0.5, 0.7); composer.addPass(bloom);
composer.addPass(new OutputPass());

const RED=new THREE.Color(0xFF5A4F), GOLD=new THREE.Color(0xC9B16C);
function render3d(t){
  const k=E.inout(clamp((t-2.35)/0.3));            // rosso → oro sul battito di 2,5 s
  const col=RED.clone().lerp(GOLD,k);
  glowU.value.copy(col).multiplyScalar(1.5);
  rim.color.copy(col); core.color.copy(col);
  pmat.color.copy(col).multiplyScalar(0.9);
  mat.metalness = 0.15+0.6*k; mat.roughness = 0.6-0.28*k;
  core.position.copy(C); core.intensity = t>2.3? 6 : 0;
  // impulso di glow sui cambi scena
  let pulse=0; for(const b of [2.5,5,7.5,10,12.5,13]) { const d=t-b; if(d>-0.05&&d<0.4) pulse=Math.max(pulse,Math.exp(-Math.max(d,0)*8)); }
  bloom.strength = 0.78 + 0.7*pulse; bloom.radius = 0.5;
  // pannello agenda
  const pin=E.soft(clamp((t-4.75)/SO)), pout=E.exit(clamp((t-7.0)/0.35));
  const ps=Math.max(0.0001, pin*(1-pout)); panel.scale.set(ps,ps,ps); panel.visible=ps>0.001;
  // particelle
  for(let i=0;i<PN;i++){ const q=p0[i]; pp[i*3]=q[0]+Math.sin(t*0.4+i)*0.2; pp[i*3+1]=((q[1]+t*q[3]+12)%24+24)%24-12; pp[i*3+2]=q[2]; }
  pgeo.attributes.position.needsUpdate=true;
  tilesAt(t); camAt(t);
  composer.render();
}

function seek(t){ seek2d(t); render3d(t); }
window.seek = seek;
window.ready = document.fonts.ready.then(()=>Promise.all([...document.images].map(im=>im.decode().catch(()=>{})))).then(()=>{ seek(0); return true; });
if(location.search.includes('play')){ window.ready.then(()=>{ const t0=performance.now();
  (function loop(){ seek(((performance.now()-t0)/1000)%DURATION); requestAnimationFrame(loop); })(); }); }
</script>
