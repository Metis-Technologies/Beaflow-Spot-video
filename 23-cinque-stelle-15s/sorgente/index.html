<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ?tema=chiaro (default) | ?tema=scuro
const TEMA = new URLSearchParams(location.search).get('tema') || 'chiaro';
const SCURO = TEMA === 'scuro';
if (SCURO) { document.body.classList.add('scuro'); document.querySelectorAll('img.logo').forEach(i=>i.src='logo-negativo.svg'); }

/* ───────── motore 2D (HANDOFF §7) ───────── */
const DURATION = 15, SP = 0.8, SO = 0.9;
function bez(x1,y1,x2,y2){ const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const fx=t=>((ax*t+bx)*t+cx)*t, fy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0)return 0; if(p>=1)return 1; let t=p; for(let i=0;i<10;i++){ const e=fx(t)-p; if(Math.abs(e)<1e-6)break; const d=dx(t); if(Math.abs(d)<1e-6)break; t-=e/d; } return fy(Math.min(1,Math.max(0,t))); }; }
function spr(k,c,dur){ const w0=Math.sqrt(k), z=c/(2*Math.sqrt(k)), wd=w0*Math.sqrt(1-z*z);
  return p=>{ if(p>=1)return 1; const t=p*dur; return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t)); }; }
const E = { lin:p=>p, enter:bez(.22,1,.36,1), exit:bez(.4,0,1,1), inout:bez(.65,0,.35,1), morph:bez(.83,0,.17,1), spring:spr(420,26,SP), soft:spr(260,30,SO) };
const reg = new Map();
const $ = s=>[...document.querySelectorAll(s)];
const els = t => typeof t==='string' ? $(t) : (t instanceof Element ? [t] : [...t]);
const ent = el => { if(!reg.has(el)) reg.set(el,{p:{},fx:[]}); return reg.get(el); };
function tw(target,s,d,props,e='enter'){ els(target).forEach(el=>{ const r=ent(el);
  for(const k in props){ (r.p[k]??=[]).push({s,d,a:props[k][0],b:props[k][1],e}); r.p[k].sort((x,y)=>x.s-y.s);} }); }
function stagger(target,s,gap,d,props,e){ els(target).forEach((el,i)=>tw(el,s+i*gap,d,props,e)); }
function fx(target,fn){ els(target).forEach(el=>ent(el).fx.push(fn)); }
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function val(list,t){ let cur=null; for(const k of list){ if(t>=k.s) cur=k; else break; }
  if(!cur) return list[0].a; const p=cur.d<=0?1:clamp((t-cur.s)/cur.d); return cur.a+(cur.b-cur.a)*E[cur.e](p); }
function seek2d(t){
  reg.forEach((r,el)=>{
    const v={}; for(const k in r.p) v[k]=val(r.p[k],t);
    const has=k=>v[k]!==undefined;
    if(has('x')||has('y')||has('scale')||has('rot'))
      el.style.transform=`translate(${v.x??0}px,${v.y??0}px) rotate(${v.rot??0}deg) scale(${v.scale??1})`;
    if(has('opacity')){ el.style.opacity=v.opacity; el.style.visibility=v.opacity<=0.001?'hidden':'visible'; }
    if(has('blur')) el.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';
    for(const f of r.fx) f(el,t);
  });
}
const hidden  = sel => tw(sel, 0, 0.01, {opacity:[0,0]});
const titleIn = (sel,s) => { hidden(`${sel} .w`); stagger(`${sel} .w`, s, 0.05, 0.4, {opacity:[0,1], y:[24,0], blur:[8,0]}, 'enter'); };
const outT    = (sel,s) => tw(sel, s, 0.3, {opacity:[1,0], y:[0,-24], blur:[0,8]}, 'exit');
const popIn   = (sel,s,y=40) => { hidden(sel); tw(sel,s,0.12,{opacity:[0,1]},'lin'); tw(sel,s,SO,{y:[y,0],scale:[.9,1]},'soft'); };

/* ───────── timeline UI ─────────
   scene: 0 gancio · 2,5 chiedi · 5 invito · 7,5 cinque stelle · 10 più clienti · 12,5 chiusura */
hidden('#logoS'); tw('#logoS',0.05,0.4,{opacity:[0,1]},'enter'); tw('#logoS',12.25,0.3,{opacity:[1,0]},'exit');
tw('#shade',0,0.01,{opacity:[1,1]}); tw('#shade',12.4,0.4,{opacity:[1,0]},'exit');
titleIn('#t1',0.1); hidden('#t1b .w'); stagger('#t1b .w',0.7,0.06,0.4,{opacity:[0,1],y:[24,0],blur:[8,0]},'enter');
outT('#h1',2.2);
titleIn('#t2',2.6); outT('#t2',4.65);
titleIn('#t3',5.1); outT('#t3',7.15);
titleIn('#t4',7.6); outT('#t4',9.65);
titleIn('#t5',10.1); outT('#t5',12.15);
hidden('#voto'); tw('#voto',10.55,0.4,{opacity:[0,1],y:[24,0],blur:[8,0]},'enter'); outT('#voto',12.15);
fx('#vR',(el,t)=>{ const p=E.inout(clamp((t-10.6)/1.3)); el.textContent='· '+Math.round(12+116*p)+' recensioni'; });
fx('#vN',(el,t)=>{ const p=E.inout(clamp((t-10.6)/1.3)); el.textContent=(3.6+1.3*p).toFixed(1).replace('.',','); });
hidden('#logoB'); tw('#logoB',13.05,0.12,{opacity:[0,1]},'lin'); tw('#logoB',13.05,SO,{scale:[.86,1],blur:[10,0]},'soft');
popIn('#btn',13.3,40); tw('#btn',14.15,0.1,{scale:[1,.93]},'exit'); tw('#btn',14.25,SO,{scale:[.93,1]},'soft');
hidden('#offer'); tw('#offer',13.5,0.4,{opacity:[0,1],y:[24,0]},'enter');
hidden('#url'); tw('#url',13.6,0.4,{opacity:[0,1],y:[24,0]},'enter');
const FL = SCURO ? [[2.5,.5],[12.85,.7]] : [[2.5,.35],[12.85,.55]];
fx('#flash',(el,t)=>{ let o=0; for(const [c,a] of FL){ const d=t-c; if(d>-0.06&&d<0.5) o=Math.max(o, a*(d<0? (d+0.06)/0.06 : Math.exp(-d*9))); } el.style.opacity=o; });

/* ───────── scena 3D ───────── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:!SCURO, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(1080,1920,false);
renderer.toneMapping = SCURO ? THREE.ACESFilmicToneMapping : THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if(!SCURO) renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(); if (SCURO) scene.background = new THREE.Color(0x0e0e0e);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = SCURO ? 0.55 : 0.45;
const cam = new THREE.PerspectiveCamera(35, 1080/1920, 0.1, 100);

scene.add(new THREE.AmbientLight(SCURO?0xffffff:0xfff6ea, SCURO?0.25:0.3));
const key = new THREE.DirectionalLight(0xfff4e6, SCURO?2.2:2.9); key.position.set(5,8,4); scene.add(key); scene.add(key.target);
key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.radius = 6; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});
const rim = new THREE.PointLight(0xffffff, SCURO?40:12, 30, 2); rim.position.set(-4,3,-4); scene.add(rim);
const warm = new THREE.PointLight(0xC9B16C, 0, 6, 2); scene.add(warm);

let seed=53; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

const N = 64, C = new THREE.Vector3(0,-1.15,0), GY = -3.1;
const geo = new RoundedBoxGeometry(1,1,1,3,0.1);
const aGlow = new THREE.InstancedBufferAttribute(new Float32Array(N),1); geo.setAttribute('aGlow',aGlow);
const glowU = {value:new THREE.Color()}, goldU = {value:new THREE.Color(0xC9B16C)}, mixU = {value: SCURO?0:1}, emU = {value: SCURO?1:0.35};
const mat = new THREE.MeshStandardMaterial({color:0xffffff, metalness:SCURO?0.7:0.05, roughness:SCURO?0.32:0.55});
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms,{uGlowColor:glowU, uGold:goldU, uMix:mixU, uEm:emU});
  sh.vertexShader = 'attribute float aGlow;\nvarying float vGlow;\n' + sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvGlow = aGlow;');
  sh.fragmentShader = 'uniform vec3 uGlowColor; uniform vec3 uGold; uniform float uMix; uniform float uEm;\nvarying float vGlow;\n' + sh.fragmentShader
    .replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uGlowColor/max(max(uGlowColor.r,uGlowColor.g),0.001)*0.75, clamp(vGlow,0.0,1.0)*uMix);')
    .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance += uGlowColor * vGlow * uEm;');
};
const tiles = new THREE.InstancedMesh(geo, mat, N);
tiles.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
tiles.castShadow = true; tiles.receiveShadow = true; tiles.frustumCulled = false;
scene.add(tiles);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShadowMaterial({opacity: SCURO?0.35:0.2}));
ground.rotation.x = -Math.PI/2; ground.position.y = GY; ground.receiveShadow = true; scene.add(ground);
const V=(x,y,z)=>new THREE.Vector3(x,y,z), Eu=new THREE.Euler();
const qe=(x,y,z)=>new THREE.Quaternion().setFromEuler(Eu.set(x,y,z));

// cinque stelle 3D
function starShape(ro, ri){ const s=new THREE.Shape(); for(let k=0;k<10;k++){ const a=Math.PI/2 + k*Math.PI/5, r=k%2?ri:ro; const x=Math.cos(a)*r, y=Math.sin(a)*r; k?s.lineTo(x,y):s.moveTo(x,y); } s.closePath(); return s; }
const starGeo = new THREE.ExtrudeGeometry(starShape(0.46,0.2), {depth:0.12, bevelEnabled:true, bevelThickness:0.05, bevelSize:0.04, bevelSegments:3}); starGeo.center();
const STARS = Array.from({length:5},(_,k)=>{ const m=new THREE.Mesh(starGeo, new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5, metalness:0.05, emissive:new THREE.Color(0xC9B16C), emissiveIntensity:0}));
  m.castShadow=true; scene.add(m); return m; });
const arcPos = k => { const a=Math.PI*(0.8-k*0.15); return V(Math.cos(a)*1.55, C.y-0.45+Math.sin(a)*0.75, 0); };
const rowPos = k => V((k-2)*0.66, C.y+0.85, 0.2);
const STAMP = [7.9,8.2,8.5,8.8,9.1];
const stampRings = STAMP.map(()=>{ const r=new THREE.Mesh(new THREE.RingGeometry(0.86,1,64), new THREE.MeshBasicMaterial({color:0xC9B16C, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false})); scene.add(r); return r; });

// particelle (polvere dorata)
const PN=420, pp=new Float32Array(PN*3), p0=[];
for(let i=0;i<PN;i++) p0.push([rnd()*18-9, rnd()*24-12, rnd()*26-18, 0.08+rnd()*0.25]);
const pgeo=new THREE.BufferGeometry(); pgeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dot=document.createElement('canvas'); dot.width=dot.height=64; { const g=dot.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.6)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); }
const pmat=new THREE.PointsMaterial({size:SCURO?0.09:0.07, map:new THREE.CanvasTexture(dot), transparent:true, depthWrite:false, opacity:SCURO?1:0.55, blending:SCURO?THREE.AdditiveBlending:THREE.NormalBlending, color:0xC9B16C});
scene.add(new THREE.Points(pgeo,pmat));

/* formazioni delle tessere */
const R = Array.from({length:N},()=>[rnd(),rnd(),rnd(),rnd(),rnd(),rnd(),rnd()]);
const EW=2.6, EH=1.65;                                          // busta dell'invito
function envPoint(i){ if(i<40){ const c=i%8, r=Math.floor(i/8); return [(c-3.5)*(EW/8), (2-r)*(EH/5)]; }
  const k=i-40, side=k<12?-1:1, f=(k%12)/11; return [side*(EW/2)*(1-f)*0.96, EH/2 - f*EH*0.62]; }
const flight = t => { const u=E.inout(clamp((t-5.3)/0.9)); return { off:V(u*1.7, u*u*1.6, -u*4.5), s:1-0.6*u, r:u*0.9 }; };
const F = {
  frammenti(t){ return R.map((r,i)=>{ const a=r[0]*Math.PI*2, rr=2.2+r[1]*1.4; const drift=Math.sin(t*0.8+i)*0.08;
      return { p:V(Math.cos(a)*rr, C.y-0.5+Math.sin(a)*rr*0.55+drift, -1.5+r[2]*1.2), q:qe(r[3]*6+t*0.3,r[4]*6,r[5]*6), s:V(0.16,0.16,0.16), g:(i%5===0)?0.4:0, c:(i%4===1)?1:0 }; }); },
  busta(t){ const fl=flight(t); return R.map((r,i)=>{ const [x,y]=envPoint(i); const flap=i>=40;
      const p=V(x,y,flap?0.06:0).multiplyScalar(fl.s).applyAxisAngle(V(0,0,1),fl.r*0.4).add(C).add(V(0,0.15,0)).add(fl.off);
      return { p, q:qe(0.12*Math.sin(t*0.9),0.25*Math.sin(t*0.6),fl.r*0.4), s:(flap?V(0.18,0.18,0.1):V(EW/8*0.92,EH/5*0.9,0.05)).multiplyScalar(fl.s), g:flap?0.85:0, c:0 }; }); },
  corona(t){ return R.map((r,i)=>{ const a=Math.PI*(1.05 - i/(N-1)*1.1); const lit=clamp((t-7.9)/1.3) > i/N;
      return { p:V(Math.cos(a)*2.2, C.y-0.45+Math.sin(a)*1.35, -0.6), q:qe(0,0,a), s:V(0.2,0.09,0.09).multiplyScalar(lit?1.25:1), g:lit?1.0:0.05, c:(i%3===1&&!lit)?1:0 }; }); },
  colonne(t){ const h=[2,3,3,4,5,6,7,8]; return R.map((r,i)=>{ const k=i%8, lv=Math.floor(i/8), vis=lv<h[k]; const grow=E.spring(clamp((t-10.3-lv*0.08-k*0.03)/SP));
      return { p:V((k-3.5)*0.46, C.y-1.75+lv*0.3, 0), q:new THREE.Quaternion(), s:vis?V(0.38,0.25,0.38).multiplyScalar(Math.max(0.001,grow)):V(0.001,0.001,0.001), g:vis&&lv===h[k]-1?1.0:0.04, c:0 }; }); },
  punto(t){ return R.map(()=>({ p:C.clone(), q:new THREE.Quaternion(), s:V(0.02,0.02,0.02), g:SCURO?4:1, c:0 })); },
  alone(t){ return R.map((r,i)=>{ const a=i/N*Math.PI*2 + t*0.3; const tilt=qe(1.15,0,0.1);
      const p=V(Math.cos(a)*3.4, Math.sin(a)*3.4, 0).applyQuaternion(tilt).add(V(0,1.0,-3.4));
      return { p, q:tilt.clone().multiply(qe(0,0,a)), s:V(0.34,0.08,0.08), g:(i%2)?0.8:0.15, c:0 }; }); },
};
const TR = [['frammenti','busta',2.25,0.85],['busta','corona',6.15,0.9],['corona','colonne',9.6,0.8],['colonne','punto',12.1,0.7],['punto','alone',12.86,0.9]];
const white = new THREE.Color(SCURO?0x3a3a3a:0xffffff), black = new THREE.Color(0x1a1a1a), tmpC=new THREE.Color();
const M4=new THREE.Matrix4();
function tilesAt(t){
  const cache={}; const get=n=>cache[n]??=F[n](t);
  for(let i=0;i<N;i++){
    let st=get('frammenti')[i];
    for(const [a,b,s,d] of TR){ const del=(i/N)*0.28; if(t<s+del) break;
      const u=E.morph(clamp((t-s-del)/d)), A=get(a)[i], B=get(b)[i];
      const p=A.p.clone().lerp(B.p,u); const arc=Math.sin(Math.PI*u);
      p.add(V((R[i][0]-.5)*1.6*arc, (R[i][1]-.2)*1.6*arc, (R[i][2]-.2)*2.2*arc));
      st={ p, q:A.q.clone().slerp(B.q,u), s:A.s.clone().lerp(B.s,u), g:A.g+(B.g-A.g)*u+arc*0.3, c:A.c+(B.c-A.c)*u };
    }
    M4.compose(st.p, st.q, st.s); tiles.setMatrixAt(i,M4);
    aGlow.array[i]=st.g; tmpC.copy(white).lerp(black,st.c); tiles.setColorAt(i,tmpC);
  }
  tiles.instanceMatrix.needsUpdate=true; tiles.instanceColor.needsUpdate=true; aGlow.needsUpdate=true;
}

/* camera */
const CK = [
 [0.0,  V(2.2,0.6,12.6),   V(0,-0.2,0), -3],
 [2.3,  V(0.9,0.3,11.6),   V(0,-0.25,0), 0],
 [2.9,  V(-2.6,1.2,12.0),  V(0,-0.2,0), 3],
 [4.9,  V(-1.4,0.6,11.4),  V(0,-0.25,0), 2],
 [5.5,  V(-1.0,0.4,10.8),  V(0.6,0.0,-1), 0],
 [6.15, V(0.6,1.0,11.0),   V(0.9,0.5,-2), -3],
 [7.3,  V(1.6,0.2,12.4),   V(0,-0.3,0), -1],
 [9.5,  V(-1.2,0.6,12.2),  V(0,-0.3,0), 2],
 [10.2, V(0.4,0.6,12.2),   V(0,-0.2,0), 0],
 [12.0, V(0,0.3,11.0),     V(0,-0.4,0), 0],
 [12.75,V(0,-0.6,4.2),     V(0,-0.8,0), 6],
 [13.3, V(0,0.6,13.2),     V(0,0.4,0), 0],
 [15.0, V(0,0.5,14.6),     V(0,0.4,0), 0],
];
const posC=new THREE.CatmullRomCurve3(CK.map(k=>k[1]),false,'centripetal');
const tgtC=new THREE.CatmullRomCurve3(CK.map(k=>k[2]),false,'centripetal');
function camAt(t){
  let i=0; while(i<CK.length-2 && t>=CK[i+1][0]) i++;
  const a=CK[i], b=CK[i+1], f=clamp((t-a[0])/(b[0]-a[0])), u=(i+f)/(CK.length-1);
  cam.position.copy(posC.getPoint(u)); cam.lookAt(tgtC.getPoint(u));
  cam.rotateZ(THREE.MathUtils.degToRad(a[3]+(b[3]-a[3])*E.inout(f)));
}

let composer=null, bloom=null;
if (SCURO) { composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene,cam));
  bloom = new UnrealBloomPass(new THREE.Vector2(540,960), 0.8, 0.5, 0.7); composer.addPass(bloom); composer.addPass(new OutputPass()); }

const RED=new THREE.Color(0xFF5A4F), GOLD=new THREE.Color(0xC9B16C), WH=new THREE.Color(0xffffff), GOLDB=new THREE.Color(0xD9BE6E);
function render3d(t){
  const k=E.inout(clamp((t-2.35)/0.3));
  const col=RED.clone().lerp(GOLD,k);
  glowU.value.copy(col).multiplyScalar(SCURO?1.5:1.0);
  rim.color.copy(col);
  // stelle: nel gancio due rosse e tre vuote; escono, poi tornano e si «stampano» d'oro una per una; infine in fila sopra le colonne
  const out1=E.exit(clamp((t-2.2)/0.35)), back=E.soft(clamp((t-6.85)/SO)), toRow=E.inout(clamp((t-9.75)/0.6)), out2=E.exit(clamp((t-12.05)/0.35));
  STARS.forEach((st,j)=>{
    const stamp=t>=STAMP[j]; const sp=stamp?E.spring(clamp((t-STAMP[j])/SP)):0;
    const vis = t<2.55 ? (1-out1) : back*(1-out2);
    const pos = arcPos(j).lerp(rowPos(j), toRow);
    const pop = stamp ? (1.35-0.35*sp) : 1;
    const sc = Math.max(0.0001, vis*pop*0.82*(1-0.3*toRow));
    st.position.copy(pos).add(V(0,0.04*Math.sin(t*2+j),0)); st.scale.setScalar(sc); st.visible=sc>0.001;
    st.rotation.set(0.15*Math.sin(t*0.8+j), (t<2.55? 0.3*Math.sin(t+j) : (stamp? (1-sp)*Math.PI*2 : 0.4*Math.sin(t+j))), 0);
    const m=st.material;
    if(t<2.55){ const red=j<2; m.color.copy(red?RED:WH); m.emissive.copy(RED); m.emissiveIntensity=red?(SCURO?0.8:0.25):0; m.metalness=0.05; m.roughness=0.5; m.transparent=!red; m.opacity=red?1:0.55; }
    else { m.transparent=false; m.opacity=1; m.color.copy(WH).lerp(GOLDB, stamp?1:0); m.emissive.copy(GOLD); m.emissiveIntensity=stamp?(SCURO?1.2:0.35):0; m.metalness=stamp?0.75:0.05; m.roughness=stamp?0.28:0.5; }
  });
  stampRings.forEach((r,j)=>{ const d=t-STAMP[j], on=d>=0&&d<0.7; r.position.copy(arcPos(j)).add(V(0,0,-0.05)); r.scale.setScalar(0.35+Math.max(0,d)*1.8); r.material.opacity=on?(1-d/0.7)*0.9:0; r.visible=on; });
  // particelle: scia dorata dietro la busta in volo
  for(let i=0;i<PN;i++){ const q=p0[i]; pp[i*3]=q[0]+Math.sin(t*0.4+i)*0.2; pp[i*3+1]=((q[1]+t*q[3]+12)%24+24)%24-12; pp[i*3+2]=q[2]; }
  pgeo.attributes.position.needsUpdate=true;
  if (bloom) { let pulse=0; for(const b of [2.5,5,7.5,10,12.5,13]) { const dd=t-b; if(dd>-0.05&&dd<0.4) pulse=Math.max(pulse,Math.exp(-Math.max(dd,0)*8)); }
    bloom.strength = 0.78 + 0.7*pulse; }
  tilesAt(t); camAt(t);
  if (composer) composer.render(); else renderer.render(scene, cam);
}

function seek(t){ seek2d(t); render3d(t); }
window.seek = seek;
window.ready = document.fonts.ready.then(()=>Promise.all([...document.images].map(im=>im.decode().catch(()=>{})))).then(()=>{ seek(0); return true; });
if(location.search.includes('play')){ window.ready.then(()=>{ const t0=performance.now();
  (function loop(){ seek(((performance.now()-t0)/1000)%DURATION); requestAnimationFrame(loop); })(); }); }
</script>
