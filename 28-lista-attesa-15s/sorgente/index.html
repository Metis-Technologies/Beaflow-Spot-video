        const d=t-0.9, vx=(r[0]-0.5)*2.4, vy=1.2+r[1]*1.4, vz=0.6+r[2]*1.4;
        const p=h.clone().add(V(vx*d, vy*d-4.9*d*d, vz*d)); const fade=Math.max(0.001,1-clamp((d-1.0)/0.4));
        return { p, q:qe(d*6*r[3],d*5*r[4],d*7*r[5]), s:V(0.22,0.15,0.1).multiplyScalar(fade), g:0.5, c:0 }; }
      if(i<38){ const k=i-30; const appear=E.spring(clamp((t-2.65-k*0.07)/SP)); const base=qPos(k,t);
        const lit=clamp((t-NOTIFY(k))/0.15), litDecay = lit*Math.exp(-Math.max(0,t-NOTIFY(k))*1.2);
        if(k===WIN && t>=8.1){ const u=E.inout(clamp((t-8.1)/0.85)); const h=slotPos(GAP_I);
          const p=base.clone().lerp(h,u); p.z += Math.sin(Math.PI*u)*1.6; p.y += Math.sin(Math.PI*u)*0.6;
          return { p, q:qe(0,Math.sin(Math.PI*u)*0.8,u*Math.PI*2), s:V(0.38,0.3,0.12).lerp(V(0.64,0.3,0.12),u), g:1.0, c:0 }; }
        const dim = t>8.3 ? clamp((t-8.3)/0.4) : 0;
        return { p:base.clone().add(V(0,(1-appear)*-1.2, k===WIN&&t>7.9?0.15:0)), q:new THREE.Quaternion(), s:V(0.38,0.3,0.12).multiplyScalar(Math.max(0.001,appear)), g:(0.2+litDecay*0.9+(k===WIN&&t>7.9?0.6:0))*(1-dim*0.8), c:(k%3===1)?0.85*(1-0):0 }; }
      const a=(i-38)/26*Math.PI*2 + t*0.25, rr=2.9+0.3*Math.sin(i*1.3);
      return { p:V(Math.cos(a)*rr, C.y+0.1+Math.sin(a)*rr*0.85, -1.4+Math.sin(a*2+t)*0.3), q:qe(t+i,t*0.7,0), s:V(0.11,0.11,0.11).multiplyScalar(intro), g:(i%3===0)?0.5:0, c:(i%4===1)?1:0 }; }); },
  punto(t){ return R.map(()=>({ p:C.clone(), q:new THREE.Quaternion(), s:V(0.02,0.02,0.02), g:SCURO?4:1, c:0 })); },
  alone(t){ return R.map((r,i)=>{ const a=i/N*Math.PI*2 + t*0.3; const tilt=qe(1.15,0,0.1);
      const p=V(Math.cos(a)*3.4, Math.sin(a)*3.4, 0).applyQuaternion(tilt).add(V(0,1.0,-3.4));
      return { p, q:tilt.clone().multiply(qe(0,0,a)), s:V(0.34,0.08,0.08), g:(i%2)?0.8:0.15, c:0 }; }); },
};
const TR = [['scena','punto',12.1,0.7],['punto','alone',12.86,0.9]];
const white = new THREE.Color(SCURO?0x3a3a3a:0xffffff), black = new THREE.Color(0x1a1a1a), tmpC=new THREE.Color();
const M4=new THREE.Matrix4();
function tilesAt(t){
  const cache={}; const get=n=>cache[n]??=F[n](t);
  for(let i=0;i<N;i++){
    let st=get('scena')[i];
    for(const [a,b,s,d] of TR){ const del=(i/N)*0.28; if(t<s+del) break;
      const u=E.morph(clamp((t-s-del)/d)), A=get(a)[i], B=get(b)[i];
      const p=A.p.clone().lerp(B.p,u); const arc=Math.sin(Math.PI*u);
      p.add(V((R[i][0]-.5)*1.6*arc, (R[i][1]-.2)*1.6*arc, (R[i][2]-.2)*2.2*arc));
      st={ p, q:A.q.clone().slerp(B.q,u), s:A.s.clone().lerp(B.s,u), g:A.g+(B.g-A.g)*u+arc*0.3, c:A.c+(B.c-A.c)*u };
    }
    M4.compose(st.p, st.q, st.s); tiles.setMatrixAt(i,M4);
    aGlow.array[i]=st.g; tmpC.copy(white).lerp(black,st.c); tiles.setColorAt(i,tmpC);
  }
  tiles.instanceMatrix.needsUpdate=true; tiles.instanceColor.needsUpdate=true; aGlow.needsUpdate=true;
}

/* camera */
const CK = [
 [0.0,  V(1.4,0.8,12.0),   V(0,-0.15,0), -3],
 [0.85, V(0.8,0.5,10.4),   V(0,-0.1,0), 0],
 [2.3,  V(0.4,0.6,11.6),   V(0,-0.2,0), 0],
 [2.9,  V(-2.6,1.4,11.0),  V(0,-0.5,0), 3],
 [4.9,  V(-1.8,1.0,10.8),  V(0,-0.5,0), 2],
 [5.45, V(2.6,-0.6,10.2),  V(0,-0.7,0), -3],
 [7.2,  V(2.0,-0.4,10.0),  V(0,-0.7,0), -2],
 [7.9,  V(-1.6,0.6,10.8),  V(0,-0.4,0), 2],
 [9.6,  V(-0.8,0.4,10.6),  V(0,-0.3,0), 1],
 [10.2, V(0.4,0.8,11.6),   V(0,-0.2,0), 0],
 [12.0, V(0,0.4,11.4),     V(0,-0.3,0), 0],
 [12.75,V(0,-0.6,4.2),     V(0,-0.8,0), 6],
 [13.3, V(0,0.6,13.2),     V(0,0.4,0), 0],
 [15.0, V(0,0.5,14.6),     V(0,0.4,0), 0],
];
const posC=new THREE.CatmullRomCurve3(CK.map(k=>k[1]),false,'centripetal');
const tgtC=new THREE.CatmullRomCurve3(CK.map(k=>k[2]),false,'centripetal');
function camAt(t){
  let i=0; while(i<CK.length-2 && t>=CK[i+1][0]) i++;
  const a=CK[i], b=CK[i+1], f=clamp((t-a[0])/(b[0]-a[0])), u=(i+f)/(CK.length-1);
  cam.position.copy(posC.getPoint(u)); cam.lookAt(tgtC.getPoint(u));
  cam.rotateZ(THREE.MathUtils.degToRad(a[3]+(b[3]-a[3])*E.inout(f)));
}

let composer=null, bloom=null;
if (SCURO) { composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene,cam));
  bloom = new UnrealBloomPass(new THREE.Vector2(540,960), 0.8, 0.5, 0.7); composer.addPass(bloom); composer.addPass(new OutputPass()); }

const RED=new THREE.Color(0xFF5A4F), GOLD=new THREE.Color(0xC9B16C);
function render3d(t){
  const k=E.inout(clamp((t-2.35)/0.3));
  const col=RED.clone().lerp(GOLD,k);
  glowU.value.copy(col).multiplyScalar(SCURO?1.5:1.0);
  rim.color.copy(col);
  const out=E.exit(clamp((t-12.0)/0.35)), intro=E.enter(clamp((t-0.05)/0.5));
  const bs=Math.max(0.0001,intro*(1-out)); board.scale.set(bs,bs,1); board.visible=bs>0.001;
  // cornice del buco: rossa e pulsante, poi oro in attesa, sparisce quando il posto è preso
  { const on = t>=0.95 && t<9.0; const red=t<2.5; gapFrame.material.color.copy(red?RED:GOLD);
    gapFrame.material.opacity = on ? (red ? 0.6+0.4*Math.sin(t*10) : 0.55+0.25*Math.sin(t*4)) : 0; gapFrame.visible = gapFrame.material.opacity>0.01; }
  { const d=t-8.95, on=d>=0&&d<0.8; landRing.position.copy(slotPos(GAP_I)).add(V(0,0,0.1)); landRing.scale.setScalar(0.2+Math.max(0,d)*2.2); landRing.material.opacity=on?(1-d/0.8)*0.9:0; landRing.visible=on; }
  // particelle
  for(let i=0;i<PN;i++){ const q=p0[i]; pp[i*3]=q[0]+Math.sin(t*0.4+i)*0.2; pp[i*3+1]=((q[1]+t*q[3]+12)%24+24)%24-12; pp[i*3+2]=q[2]; }
  pgeo.attributes.position.needsUpdate=true;
  if (bloom) { let pulse=0; for(const b of [2.5,5,7.5,10,12.5,13]) { const dd=t-b; if(dd>-0.05&&dd<0.4) pulse=Math.max(pulse,Math.exp(-Math.max(dd,0)*8)); }
    bloom.strength = 0.78 + 0.7*pulse; }
  tilesAt(t); camAt(t);
  if (composer) composer.render(); else renderer.render(scene, cam);
}

function seek(t){ seek2d(t); render3d(t); }
window.seek = seek;
window.ready = document.fonts.ready.then(()=>Promise.all([...document.images].map(im=>im.decode().catch(()=>{})))).then(()=>{ seek(0); return true; });
if(location.search.includes('play')){ window.ready.then(()=>{ const t0=performance.now();
  (function loop(){ seek(((performance.now()-t0)/1000)%DURATION); requestAnimationFrame(loop); })(); }); }
</script>
