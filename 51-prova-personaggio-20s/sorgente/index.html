<!--
  STYLE BRIEF (23/11): stile Motion causa → effetto (claude/STILE-MOTION.md), prova da 20 s, ossatura D «Per chi è»,
  con un personaggio 2D che parla: labiale dal volume della voce (sorgente/bocca.js, da strumenti/motion/bocca.py).
  Catena : il personaggio saluta → forbici, rasoio, pennello atterrano sopra di lui (una parola ciascuno) → domino:
           il pennello scivola nella sua mano e diventa il telefono → arrivano le chat dal telefono, lui si gratta la testa
           → col pollice tocca Beaflow → onda d'oro → le chat diventano le righe dell'elenco «Oggi», lui lo indica
           → la notifica cade nell'elenco e diventa «Luca · Colore · 16:30» → pollice in su, occhiolino
           → la spunta diventa il punto d'oro che risucchia tutto → chiusura degli spot
  Voce   : 0,15 · 4,25 · 8,50 · 12,75 · chiusura 17,40 (spot.json, voci dello spot 50)
  Formato: 1080×1920, 20 s, 30 fps; testi a 130 px dai lati (regole degli spot)
-->

/* ---- split + blur direzionale (come gli altri spot Motion) ---- */
const defs=$('#filters defs');let fc=0;
function makeBlur(){const NS='http://www.w3.org/2000/svg',id='mb'+(fc++),f=document.createElementNS(NS,'filter');f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');f.setAttribute('width','240%');f.setAttribute('height','240%');
  const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);defs.appendChild(f);return{url:`url(#${id})`,node:g};}
function blurTween(tl,el,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){const b=makeBlur(),o={v:from};
  tl.set(el,{filter:b.url},at);tl.to(o,{v:to,duration:dur,ease,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(el,{filter:'none'},at+dur);}
function split(el){const out=[];const walk=(node)=>{[...node.childNodes].forEach(n=>{
    if(n.nodeType===3){const frag=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(tok=>{if(!tok)return;
        if(/^\s+$/.test(tok)){const s=document.createElement('span');s.className='ch';s.innerHTML='&nbsp;';frag.appendChild(s);out.push(s);return;}
        const w=document.createElement('span');w.className='w';for(const c of tok){const s=document.createElement('span');s.className='ch';s.textContent=c;w.appendChild(s);out.push(s);}frag.appendChild(w);});
      n.replaceWith(frag);} else if(n.nodeType===1){walk(n);} });};walk(el);return out;}

/* ---- disegno del personaggio ---- */
const rad=d=>d*Math.PI/180;
const guyEl=$('#guy'),headEl=$('#head'),mo=$('#mo'),moC=$('#moC'),mclip=$('#mclipP'),teeth=$('#teeth'),tongue=$('#tongue');
const eyL=$('#eyL'),eyR=$('#eyR'),brL=$('#brL'),brR=$('#brR'),phoneG=$('#phoneG');
const arms={L:$('#armL'),R:$('#armR')};
function arm(side,a1,a2){const [sx,sy]=SH[side];const ex=sx+L1*Math.sin(rad(a1)),ey=sy+L1*Math.cos(rad(a1));
  const wx=ex+L2*Math.sin(rad(a2)),wy=ey+L2*Math.cos(rad(a2));const el=arms[side];
  const up=`M${sx} ${sy}L${ex.toFixed(1)} ${ey.toFixed(1)}`,fo=`M${ex.toFixed(1)} ${ey.toFixed(1)}L${wx.toFixed(1)} ${wy.toFixed(1)}`;
  el.querySelector('.ao1').setAttribute('d',up);el.querySelector('.af1').setAttribute('d',up);
  el.querySelector('.ao2').setAttribute('d',fo);el.querySelector('.af2').setAttribute('d',fo);
  el.querySelector('.hand').setAttribute('transform',`translate(${wx.toFixed(1)} ${wy.toFixed(1)}) rotate(${(-a2).toFixed(1)})`);
  return [wx,wy];}
function mouthPath(hw,h){return `M${-hw} 0 Q0 ${(-h*.35).toFixed(1)} ${hw} 0 Q0 ${(h*1.5).toFixed(1)} ${-hw} 0 Z`;}
const CLOSED=['M-40 -6 Q0 20 40 -6','M-32 6 Q-16 -4 0 6 Q16 14 32 4','M-48 -10 Q0 30 48 -10'];
const OPEN=[[0,0],[28,18],[33,34],[37,50]];
const toStage=(px,py)=>{const s=CAM.s*(1-G.imp);return{x:CX+px*s,y:CY+py*s,s};};
let CX=0,CY=0;
function drawGuy(t){
  // il punto d'oro risucchia anche il personaggio
  const dx=dotPos.x,dy=dotPos.y;CX=dx+(CAM.x-dx)*(1-G.imp);CY=dy+(CAM.y-dy)*(1-G.imp);
  const f=Math.min(BOCCA.a.length-1,Math.max(0,Math.round(t*BOCCA.fps)));
  const a=t<CL?(BOCCA.a[f]||0):0,w=BOCCA.w[f]||0;
  const breathe=Math.sin(t*2.2)*4, nod=-a*2.2;
  guyEl.style.transform=`translate(${CX.toFixed(1)}px,${(CY+breathe*CAM.s).toFixed(1)}px) scale(${(CAM.s*(1-G.imp)).toFixed(4)})`;
  headEl.setAttribute('transform',`rotate(${(G.tilt+Math.sin(t*1.3)*1.2).toFixed(2)} 300 560) translate(0 ${(45+nod).toFixed(1)})`);
  // occhi: sguardo e battito
  const ex=G.look*9,ey=G.lookY*7;
  eyL.setAttribute('transform',`translate(${ex.toFixed(1)} ${ey.toFixed(1)}) translate(248 316) scale(1 ${G.blinkL.toFixed(2)}) translate(-248 -316)`);
  eyR.setAttribute('transform',`translate(${ex.toFixed(1)} ${ey.toFixed(1)}) translate(352 316) scale(1 ${G.blinkR.toFixed(2)}) translate(-352 -316)`);
  // sopracciglia: + alzate, − perplesso (uno su e uno giù)
  const b=G.brows;brL.setAttribute('transform',`translate(0 ${(-b*10 - (b<0?-b*6:0)).toFixed(1)}) rotate(${(b<0?b*8:-b*3).toFixed(1)} 245 260)`);
  brR.setAttribute('transform',`translate(0 ${(-b*10 + (b<0?b*10:0)).toFixed(1)}) rotate(${(b<0?b*-4:b*3).toFixed(1)} 355 260)`);
  // bocca: 4 aperture dal volume della voce, larga o tonda
  if(a>0){let [hw,h]=OPEN[a];if(!w){hw*=.78;h*=1.08;}const d=mouthPath(hw,h);
    mo.setAttribute('d',d);mclip.setAttribute('d',d);moC.setAttribute('d','');
    teeth.setAttribute('y',(-h*.35).toFixed(1));teeth.setAttribute('height',(h*.3).toFixed(1));
    tongue.setAttribute('cy',(h*.62).toFixed(1));tongue.setAttribute('rx',(hw*.6).toFixed(1));tongue.setAttribute('ry',(h*.28).toFixed(1));
    mo.style.display=teeth.style.display=tongue.style.display='';}
  else{mo.setAttribute('d','');mclip.setAttribute('d','');teeth.style.display=tongue.style.display='none';moC.setAttribute('d',CLOSED[G.expr|0]);}
  // braccia, telefono, pollice
  arm('L',G.aL1,G.aL2);const wR=arm('R',G.aR1,G.aR2);
  arms.L.querySelector('.thumb').setAttribute('opacity',G.thumb.toFixed(2));
  phoneG.setAttribute('opacity',G.phone>0?1:0);
  phoneG.setAttribute('transform',`translate(${wR[0].toFixed(1)} ${(wR[1]+6).toFixed(1)}) translate(35 0) scale(${Math.max(.001,G.phone).toFixed(3)} 1) translate(-35 0)`);
  return toStage(wR[0],wR[1]);}

/* ---- render: tutto da tl.time() ---- */
const turb=$('#turb'),nb=$('#nb'),dot=$('#dot'),cnt=$('#cnt'),wave=$('#wave'),k3w=$('#k3w'),k3=$('#k3');
const drift=(el,t,ax,ay,bx,by,s1,s2)=>{el.style.transform=`translate(${(ax+bx*Math.sin(t*s1)).toFixed(1)}px,${(ay+by*Math.cos(t*s2)).toFixed(1)}px)`;};
const st=()=>$('#stage').getBoundingClientRect();
function screenOf(el){const r=el.getBoundingClientRect(),s=st(),k=s.width/W;return{x:(r.left+r.width/2-s.left)/k,y:(r.top+r.height/2-s.top)/k,w:r.width/k};}
let lastCnt='';const dotPos={x:540,y:1000};
function render(t){
  drift($('#g1a'),t,-260,260,180,120,.45,.38);drift($('#g1b'),t,380,-160,140,110,.33,.41);
  drift($('#g2a'),t,-200,420,170,110,.42,.36);drift($('#g2b'),t,420,-120,120,100,.35,.4);
  drift($('#g3a'),t,300,500,160,120,.4,.35);drift($('#g3b'),t,-300,-100,120,120,.37,.44);
  turb.setAttribute('seed',String(1+Math.floor(t*12)%48));
  // punto d'oro (prima del personaggio: serve al risucchio)
  if(t>=DOT0&&t<CL){const c=screenOf($('#chk'));const m=dotp.m;dotPos.x=c.x+(LOGO.x-c.x)*m;dotPos.y=c.y+(LOGO.y-c.y)*m;
    dot.style.left=dotPos.x.toFixed(1)+'px';dot.style.top=dotPos.y.toFixed(1)+'px';dot.style.opacity=dotp.a;gsap.set(dot,{scale:.3+1.3*dotp.a+1.0*m});}
  else if(t<DOT0){dot.style.opacity=0;}
  else{dot.style.left=LOGO.x+'px';dot.style.top=LOGO.y+'px';}
  const hand=drawGuy(t);
  const phoneC={x:hand.x+35*hand.s,y:hand.y-100*hand.s};
  // il pennello: dalla mensola alla mano, poi si gira e diventa il telefono
  if(t<3.12){k3w.style.transform='none';k3.style.visibility='visible';}
  else{const home={x:840,y:785};const u=kp.u;const tx=hand.x+20,ty=hand.y-70;
    const x=cub(u,home.x,home.x+60,tx+40,tx)-home.x,y=cub(u,home.y,home.y+40,ty-140,ty)-home.y;
    k3w.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    gsap.set(k3,{scaleX:(t<3.45?1:flip.b)*(1-.35*u),scaleY:1-.35*u,rotation:70*(1-u)+(-8)*u,transformOrigin:'50% 50%'});
    k3.style.visibility=t<3.59?'visible':'hidden';}
  // onda d'oro dal telefono
  if(t>=7.6&&t<S3T+.5){wave.style.transform=`translate(${phoneC.x.toFixed(1)}px,${phoneC.y.toFixed(1)}px) scale(${(t<S3T?wv.s:20).toFixed(3)})`;}
  // bokeh
  const inClose=t>=CL;
  bokEls.forEach((d,i)=>{const b=BOK[i];let x=b[0]+30*Math.sin(t*.35+i),y=b[1]+25*Math.cos(t*.3+i);
    if(t<S2T){y=b[1]+t*50*(.6+b[3]);}
    else if(t<S3T){y=b[1]-(t-S2T)*70*(.6+b[3]);}
    else if(t<S4T){x=b[0]-(t-S3T)*60*(.6+b[3]);}
    else {y=b[1]+(t-S4T)*50*(.6+b[3]);}
    d.style.transform=`translate(${(x-b[2]/2).toFixed(1)}px,${(y-b[2]/2).toFixed(1)}px)`;
    d.style.background='rgba(222,200,140,.32)';d.style.opacity=inClose?0:.45;});
  // chat: escono dal telefono (S2), tremano, poi volano nelle righe dell'elenco (S3)
  BUBS.forEach((b,k)=>{const el=bubEls[k];let op=0,x=b[3],y=b[4],s=1,r=0;
    if(t>=b[5]&&t<S3T){const p=pops[k].p;op=Math.min(1,p*2);s=.3+.7*p;r=(k%2?4:-4)*(1-p);
      x=phoneC.x+(b[3]-phoneC.x)*p;y=phoneC.y+(b[4]-phoneC.y)*p-Math.sin(Math.PI*p)*60;
      const j=Math.max(0,Math.min(1,(t-5.9)/.6));x+=j*5*Math.sin(t*31+k*2);y+=j*4*Math.cos(t*27+k);
      if(t>7.55){const z=Math.min(1,(t-7.55)/.65);x=x+(phoneC.x-x)*.08*z;y=y+(phoneC.y-y)*.06*z;s*=1+.05*z;}}
    else if(t>=S3T&&t<ARR[k]+.2){const u=fl[k].u,row=screenOf($('#row'+(k+1)));
      const x0=b[3],y0=b[4];x=cub(u,x0,x0+(k%2?-60:60),row.x,row.x);y=cub(u,y0,y0-120,row.y-140,row.y);
      s=1+(row.w/380-1)*u;r=(k%2?-8:8)*Math.sin(Math.PI*u);op=t<ARR[k]?1:Math.max(0,1-(t-ARR[k])/.18);}
    el.style.opacity=op;
    el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;});
  // contatore dell'elenco
  let n=ARR.filter(a=>t>=a-.02).length+(t>=IMP?1:0);const txt=n===1?'1 prenotazione':`${n} prenotazioni`;
  if(txt!==lastCnt){cnt.textContent=txt;lastCnt=txt;}
  // notifica: scende sopra l'elenco (S3), poi cade nelle 16:30 e diventa la riga (S4)
  let no=0,nx=400,ny=580,ns=1,nr=0;
  if(t>=11.55&&t<S4T){const a=nbp.a;no=Math.min(1,a*1.5);ns=.7+.3*a;ny=580+6*Math.sin(t*7);nr=2*Math.sin(t*18)*(1-a*.6);}
  else if(t>=S4T&&t<IMP+.12){const u=nbp.u,r5=screenOf($('#row5'));no=t<IMP?1:Math.max(0,1-(t-IMP)/.12);
    nx=400+(r5.x-400)*u;ny=580+(r5.y-580)*u;ns=1+(r5.w/540-1)*u;nr=-3*Math.sin(Math.PI*u);}
  nb.style.opacity=no;nb.style.transform=`translate(${nx.toFixed(1)}px,${ny.toFixed(1)}px) rotate(${nr.toFixed(2)}deg) scale(${ns.toFixed(3)})`;
}

/* ---- colla ---- */
const stage=$('#stage');
const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${k})`;};
addEventListener('resize',fit);fit();
(function frame(){render(tl.time());requestAnimationFrame(frame);})();
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}if(/^[rR]$/.test(e.key))tl.play(0);});
if(Q.has('debug')){const ui=$('#ui');ui.style.cssText='display:flex;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);gap:10px;background:#111;color:#ddd;padding:10px 14px;border-radius:12px;font:13px system-ui;z-index:9';
  ui.innerHTML='<input id="sc" type="range" min="0" max="1000" value="0" style="width:320px"><span id="ck">0.00s</span>';
  $('#sc').oninput=e=>{tl.pause();tl.time(e.target.value/1000*DURATION);};setInterval(()=>{$('#ck').textContent=tl.time().toFixed(2)+'s';},100);}
tl.eventCallback('onComplete',()=>tl.play(0));
const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();render(t);};
window.OPENER={tl,DURATION,seek,W,H,ready:false};
document.fonts.ready.then(()=>{window.OPENER.ready=true;tl.time(0);render(0);if(!Q.has('clean'))tl.play(0);});
</script>
</body>
</html>
